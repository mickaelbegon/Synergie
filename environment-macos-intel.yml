      - h5py==3.14.0
      - keras-tuner==1.4.7
      - firebase-admin==7.1.0
      - google-cloud-firestore==2.27.0
      - grpcio==1.80.0
      - cffi==2.0.0
      - ttkbootstrap==1.10.1
      - pytest==8.3.5
      - aeon==1.3.0
      - opencv-python-headless==4.10.0.84
      - Pillow==11.2.1
